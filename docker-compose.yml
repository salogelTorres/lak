services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      # so you can tweak the system prompt without rebuilding the image
      - ./app/prompts:/app/app/prompts:ro

  # Local model server. The bot reaches it at http://ollama:11434 (the
  # default OLLAMA_BASE_URL in .env.example), over the network Compose sets
  # up between the two services — no host-installed Ollama needed.
  #
  # Not used at all when LLM_BACKEND=cloud, but Compose still starts it
  # since `bot` depends on it; that's harmless (idle container, no requests
  # sent to it) and keeps this file simple. Remove the `ollama` service and
  # `bot`'s `depends_on` if you only ever use the cloud backend.
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      # Ollama unloads a model from memory/VRAM after 5 minutes idle by
      # default, so it has to be reloaded (can be a minute or more) on the
      # next message. This is a dedicated instance for the bot, so keep
      # whatever's loaded resident indefinitely instead. The bot also
      # warms the model up on startup (see app/bot.py), so together the
      # only slow reply should be right after `docker compose up`.
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # GPU acceleration (NVIDIA): setup.py detects an NVIDIA GPU + the
    # NVIDIA Container Toolkit and writes docker-compose.override.yml with
    # the `deploy.resources.reservations.devices` block for this service —
    # Compose merges it automatically, no flags needed. Without a GPU,
    # Ollama runs on CPU, which is much slower for anything past a small
    # model. See docker-compose.override.yml.example to add it by hand.

volumes:
  ollama_data:
